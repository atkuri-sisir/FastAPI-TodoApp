{% include 'layout.html' %}

<div class="container">
    <div class="card text-center">
        <div class="card-header">
            Your TO-DO List
        </div>
        <div class="card-body">
            <h5 class="card-title">
                Manage all your To-do items
            </h5>
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Title</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for todo in todos%}
                    {% if todo.complete == False %}
                    <tr>
                        <td>{{loop.index}}</td>
                        <td>{{todo.title}}</td>
                        <td>
                            <button onclick="window.location.href='/todos/edit-todo-page/{{todo.id}}'" 
                                type="button" class="btn btn-info">
                                Edit
                            </button>
                        </td>
                    </tr>
                    {% else %}
                    <tr class="pointer alert alert-success">
                        <td>{{loop.index}}</td>
                        <td class="strike-through-td">{{todo.title}}</td>
                        <td>
                            <button onclick="window.location.href='/todos/edit-todo-page/{{todo.id}}'" 
                                type="button" class="btn btn-info">
                                Edit
                            </button>
                        </td>
                    </tr>
                    {% endif %}
                    {% endfor %}
                </tbody>
            </table>
            <a href="/todos/add-todo-page" class="btn btn-primary">Add a new todo!</a>
        </div>
    </div>
</div>
